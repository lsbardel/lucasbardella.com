name: release

# Triggered by `v*` tags (push one with `make release`). Extracts the matching
# section from .github/release-notes.md, builds the site from the tagged
# commit, then publishes the notes as the GitHub Release body. Re-runs
# idempotently update an existing release rather than failing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The data and analytics secrets live in this environment, not at repo level.
    environment:
      name: github-pages
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
      GA_CLIENT_EMAIL: ${{ secrets.GA_CLIENT_EMAIL }}
      GA_PRIVATE_KEY: ${{ secrets.GA_PRIVATE_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TRADING_DATA_URL: ${{ secrets.TRADING_DATA_URL }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Fail fast, before the long build, when the notes are missing.
      - name: extract release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="## ${TAG}" '
            $0 == tag { in_section = 1; next }
            /^## / && in_section { exit }
            in_section { print }
          ' .github/release-notes.md > "${RUNNER_TEMP}/notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md"; then
            echo "No section '## ${TAG}' found in .github/release-notes.md" >&2
            exit 1
          fi
          echo "--- extracted notes for ${TAG} ---"
          cat "${RUNNER_TEMP}/notes.md"
      - name: check tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: install uv
        run: pip install uv
      - name: python tests
        run: make py-test
      - name: build CFD image
        run: make cfd-build
      - name: run CFD cases
        run: make cfd-cases
      - name: run data loaders
        run: npm i && make data
      - name: download thesis
        run: make phd
      - name: build bundle
        run: npm run build
      - name: publish GitHub release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
